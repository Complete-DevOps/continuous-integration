name: Reusable Init Workflow

on:
  workflow_call:
    outputs:
      docker_image_name:
        description: "Generated Docker Image Name"
        value: ${{ jobs.init-stage.outputs.docker_image_name }}
      repo_name:
        description: "Repository Name"
        value: ${{ jobs.init-stage.outputs.repo_name }}
      branch_name:
        description: "Branch Name"
        value: ${{ jobs.init-stage.outputs.branch_name }}

jobs:
  init-stage:
    runs-on: ubuntu-latest
    outputs:
      docker_image_name: ${{ steps.generate_name.outputs.docker_image_name }}
      repo_name: ${{ steps.get_repo.outputs.repo_name }}
      branch_name: ${{ steps.get_branch.outputs.branch_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Load Pipeline Configuration
        id: load_config
        run: |
          # Default to false if file or keys don't exist
          REPO_VAL=false
          BRANCH_VAL=false
          IMAGE_VAL=false

          if [ -f .pipeline/flow.yml ]; then
            REPO_VAL=$(yq eval '.Init.repoDetails // false' .pipeline/flow.yml 2>/dev/null)
            BRANCH_VAL=$(yq eval '.Init.branchDetails // false' .pipeline/flow.yml 2>/dev/null)
            IMAGE_VAL=$(yq eval '.Init.imageVersion // false' .pipeline/flow.yml 2>/dev/null)
          fi

          echo "repo_enabled=${REPO_VAL}" >> $GITHUB_OUTPUT
          echo "branch_enabled=${BRANCH_VAL}" >> $GITHUB_OUTPUT
          echo "image_enabled=${IMAGE_VAL}" >> $GITHUB_OUTPUT

      - name: Fetch Repository Details
        id: get_repo
        if: steps.load_config.outputs.repo_enabled == 'true'
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT
          echo "Fetched repo_name: $REPO_NAME"

      - name: Fetch Branch Details
        id: get_branch
        if: steps.load_config.outputs.branch_enabled == 'true'
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "Fetched branch_name: $BRANCH_NAME"

      - name: Create Docker Image Name
        id: generate_name
        if: steps.load_config.outputs.image_enabled == 'true'
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          TIMESTAMP=$(date +'%d-%m-%Y-%H-%M-%S')
          IMAGE_NAME="${REPO_NAME}-${TIMESTAMP}-${SHORT_SHA}"
          echo "docker_image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "Generated Docker Image Name: $IMAGE_NAME"
